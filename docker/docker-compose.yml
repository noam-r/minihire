version: "3.8"

services:
  pocketbase:
    build:
      context: ..
      dockerfile: docker/Dockerfile.pocketbase
    container_name: minihire-pocketbase
    env_file:
      - ../.env
    ports:
      - "8090:8090"
    volumes:
      - pocketbase_data:/pb_data
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    container_name: minihire-web
    depends_on:
      - pocketbase
    env_file:
      - ../.env
    environment:
      POCKETBASE_URL: ${POCKETBASE_URL:-http://pocketbase:8090}
      HOST: 0.0.0.0
      PORT: 4321
    ports:
      - "4321:4321"
    restart: unless-stopped

volumes:
  pocketbase_data:
